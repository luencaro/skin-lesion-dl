# Configuración común a todos los modelos y al EDA.
# El entrenamiento usa la sección `train` y las rutas runs_dir, tuning_dir, pilot_dir y final_dir;
# la evaluación y el benchmark, las secciones `final`, `evaluation` y `benchmark` (al final).

seed: 42

# Rutas relativas a la raíz del proyecto (src/data.py las resuelve como absolutas).
paths:
  raw_dir: data/raw
  images_dir: data/raw/images
  metadata_csv: data/raw/HAM10000_metadata.csv
  segmentations_dir: data/raw/segmentations
  hashes_json: data/hashes.json
  phash_csv: data/interim/phash.csv
  duplicates_candidates_csv: data/duplicados_candidatos.csv
  duplicates_confirmed_csv: data/duplicados_confirmados.csv
  splits_csv: data/splits.csv
  splits_hash_json: data/splits_hash.json
  eda_cache_dir: data/processed/eda_cache
  artifacts_annotation_csv: data/anotacion_artefactos.csv
  train_color_stats_json: data/train_color_stats.json
  outliers_csv: data/atipicos_imagenes.csv
  embeddings_cache: data/processed/embeddings_mobilenetv2.npz
  runs_dir: outputs/runs
  tuning_dir: outputs/tuning
  pilot_dir: outputs/pilot
  final_dir: outputs/final
  benchmark_dir: outputs/benchmark
  logs_dir: outputs/logs

# Formato de los archivos
image_ext: .jpg
mask_suffix: _segmentation.png
source_column: dataset          # columna opcional con la fuente de cada imagen
missing_tokens: ["unknown", ""] # valores que se cuentan como faltantes
missing_indicator_columns: [age, sex, localization]  # columnas con indicador de faltante

# Calidad de los metadatos
age_min_valid: 1
age_max_valid: 100
valid_categories:              # categorías documentadas de HAM10000
  sex: [male, female, unknown]
  localization: [abdomen, acral, back, chest, ear, face, foot, genital, hand, lower extremity,
                 neck, scalp, trunk, unknown, upper extremity]
  dx: [akiec, bcc, bkl, df, mel, nv, vasc]
  dx_type: [histo, follow_up, consensus, confocal]
  dataset: [rosendahl, vidir_modern, vidir_molemax, vienna_dias]
lesion_consistency_columns: [age, sex, localization, dx_type, dataset]
eda_inconsistency_examples: 20  # filas de ejemplo de lesiones inconsistentes

# Partición
test_size: 0.15
n_folds: 5
overwrite_splits: false

# Duplicados (pHash)
phash_hash_size: 8              # hash de 8 x 8 = 64 bits
phash_threshold: 2              # distancia de Hamming máxima para proponer un par
phash_dist_max: 16              # distancia máxima que muestra la tabla de distribución
eda_pairs_page_size: 20         # pares por página en la revisión visual
eda_pairs_pages_per_figure: 2   # páginas que se muestran una al lado de la otra

# Caché e inspección visual
eda_cache_max_side: 300
eda_cache_format: jpg
eda_cache_jpeg_quality: 95
eda_grid_per_class: 16
eda_grid_ncols: 8

# Artefactos
eda_annotation_per_class: 40
eda_annotation_page_size: 20
artifact_columns: [regla, tinta, vello, burbujas, vineteado, parche_color]
eda_vignette_corner_frac: 0.1   # lado de cada esquina, fracción del lado menor

# Color
eda_luma_weights: [0.299, 0.587, 0.114]  # luminancia ITU-R BT.601
shades_of_gray_p: 6
eda_sog_examples_per_class: 1

# Máscaras de lesión
mask_threshold: 127
mask_min_frac: 0.001            # fracción de área por debajo de la cual la máscara está casi vacía
mask_max_frac: 0.95             # fracción de área por encima de la cual la máscara está casi completa
eda_mask_overlay_n: 16          # imágenes por cuadrícula de contornos de máscara

# Mapas medios, imágenes media y capacidad predictiva del fondo
eda_mean_image_size: [64, 48]   # (ancho, alto)
min_background_frac: 0.05       # fracción mínima de fondo para incluir una imagen
bg_probe_max_iter: 2000         # iteraciones de la regresión logística multinomial

# Validación adversarial
adv_hist_bins: 16
adv_cv_folds: 5
adv_max_iter: 1000

# Calidad de imagen
clip_low: 0                     # valor de píxel recortado por abajo (<=)
clip_high: 255                  # valor de píxel recortado por arriba (>=)
clip_frac_alert: 0.01           # proporción de píxeles recortados que activa la alerta

# Atípicos en las características de imagen
iqr_factor: 1.5
robust_z: 3.5
mahal_quantile: 0.975
eda_outlier_grid_n: 16

# Estadística
chi2_mc_iterations: 10000       # permutaciones para el p-valor simulado de chi-cuadrado
eda_hist_bins: auto             # intervalos de los histogramas univariados (numpy)
eda_spearman_top_pairs: 15      # pares con mayor |rho| que se muestran

# Embeddings
eda_embeddings: true
eda_embeddings_input_size: 224
eda_embeddings_batch_size: 64
eda_tsne_perplexity: 30
emb_probe_max_iter: 2000        # iteraciones de la regresión logística sobre los embeddings

# ---------------------------------------------------------------------------
# Entrenamiento (src/train.py, src/tune.py, src/pilot.py)
# ---------------------------------------------------------------------------
# Las clases y su orden (índice de la etiqueta) son valid_categories.dx.
train:
  image_size: 224                 # lado de la entrada; se redimensiona sin conservar la relación de aspecto
  resize_method: bilinear
  resize_antialias: true          # filtro antialias al reducir (600x450 -> 224x224)
  batch_size: 32
  mixed_precision: true           # política mixed_float16; la salida softmax queda en float32
  deterministic: false            # true -> tf.config.experimental.enable_op_determinism()
  gpu_memory_growth: true
  cache_in_memory: true           # cache tras el redimensionado, antes del aumento
  cache_dtype: float32            # float32 (~0.6 MB por imagen) o uint8 (4 veces menos RAM)
  save_weights: true              # guarda model.weights.h5 en las corridas de src.train (no en ajuste ni piloto)
  verbose: 1                      # model.fit: 1 = barra por lote, 2 = una línea por época, 0 = nada (solo terminal)

  augmentation:                   # solo en train, después de la cache; valores en [0, 255]
    flip_horizontal: true
    flip_vertical: true
    rotate_90: true               # rotación de k * 90 grados, k uniforme en {0, 1, 2, 3}
    zoom_max: 0.10                # acercamiento: recorte aleatorio de lado 1 / U(1, 1 + zoom_max) y redimensionado
    brightness: 0.10              # delta aditivo U(-b, b) sobre la escala [0, 1]
    contrast: 0.10                # factor U(1 - c, 1 + c)
    saturation: 0.10              # factor U(1 - s, 1 + s)
    hue: 0.02                     # delta U(-h, h)

  warmup:                         # fase A: backbone congelado, tasa constante
    epochs: 5
    learning_rate: 1.0e-3
    optimizer: adamw              # usa el weight_decay de los hiperparámetros del modelo

  finetune:                       # fase B: todo descongelado (BatchNormalization en modo inferencia)
    max_epochs: 30
    optimizer: adamw
    schedule: cosine              # CosineDecay desde learning_rate hasta alpha * learning_rate en max_epochs
    cosine_alpha: 0.0
    early_stopping:
      monitor: val_balanced_accuracy
      mode: max
      patience: 5
      min_delta: 0.0
      restore_best_weights: true

  weight_decay_exclude: [bias, gamma, beta]  # variables sin decaimiento de pesos en AdamW
  class_weight: inverse_frequency # w_k = N / (K * N_k) con el train de cada corrida
  ece_bins: 15

  pilot:
    pairs: [[0, 0], [1, 1], [2, 2], [3, 3], [4, 4]]   # (semilla, pliegue de validación)

  tuning:
    method: random
    n_trials: 12
    sampler_seed: 2026            # misma semilla -> mismas configuraciones para todos los modelos
    val_fold: 0
    seed: 0
    max_epochs: 15                # sustituye a finetune.max_epochs durante el ajuste
    space:                        # se muestrea en este orden
      learning_rate: {type: loguniform, low: 1.0e-5, high: 1.0e-3}
      weight_decay: {type: loguniform, low: 1.0e-6, high: 1.0e-3}
      dropout: {type: choice, values: [0.0, 0.2, 0.4]}

# ---------------------------------------------------------------------------
# Ejecución definitiva (src/final.py)
# ---------------------------------------------------------------------------
# Corridas = producto semilla x pliegue de validación (validación cruzada repetida), con
# etiqueta `label`, evaluación de test y métricas de train sin aumento ni dropout.
# El número de semillas se ajusta tras el piloto editando `seeds` (ver preregistro.md).
final:
  label: final
  seeds: [0, 1, 2, 3, 4]
  folds: [0, 1, 2, 3, 4]
  evaluate_train: true            # métricas sobre el train de la corrida, sin aumento ni dropout

# ---------------------------------------------------------------------------
# Evaluación por modelo (src/evaluation.py, src/gradcam.py)
# ---------------------------------------------------------------------------
evaluation:
  split: test                     # partición de las secciones de robustez, errores, casos difíciles y calibración
  subgroups: [dataset, dx_type, localization]   # columnas de HAM10000_metadata.csv
  subgroup_metrics: [balanced_accuracy, accuracy, f1_macro]
  subgroup_min_n: 30              # se marcan los subgrupos con menos imágenes (estimación inestable)
  overfitting_metrics: [balanced_accuracy, accuracy, f1_macro, cross_entropy]
  top_confused_pairs: 10
  # data/atipicos_imagenes.csv solo cubre train (8584 imágenes): la tasa de error de las
  # imágenes atípicas se calcula con las predicciones de validación (fuera de pliegue).
  outliers:
    split: val
    mahalanobis_column: atipico_mahal
    univariate_column: n_marcas_univariadas
    univariate_min_marks: 1       # marcada si tiene al menos este número de marcas univariadas
  hard_cases:
    min_error_frac: 0.5           # falla en más de esta fracción de corridas
    grid_n: 16                    # imágenes por cuadrícula
    grid_ncols: 8
  calibration_bins: 15            # igual que train.ece_bins
  gradcam:
    run: [0, 0]                   # (semilla, pliegue) de la corrida definitiva cuyos pesos se usan
    per_class_correct: 2          # aciertos por clase en la muestra fija de test
    per_class_wrong: 2            # errores por clase (menos si la clase tiene pocos)
    sample_seed: 2026
    alpha: 0.45                   # opacidad del mapa sobre la imagen
    ncols: 7

# ---------------------------------------------------------------------------
# Benchmark y estadística (src/benchmark.py, src/stats.py, book/11-benchmark.ipynb)
# ---------------------------------------------------------------------------
# Las observaciones pareadas son las corridas con la misma semilla y el mismo pliegue.
benchmark:
  models: [mobilenetv2, resnet50, vgg16]
  primary_metric: balanced_accuracy
  split: test                     # partición de la tabla comparativa y de las pruebas
  metrics: [balanced_accuracy, accuracy, f1_macro, f1_weighted, auc_roc_macro_ovr, auc_pr_macro, mcc, ece]
  delta: 0.02                     # margen de relevancia práctica (exactitud balanceada, absoluto)
  alpha: 0.05
  power: 0.80
  p_adjust: holm
  bootstrap:
    method: percentile            # scipy.stats.bootstrap: percentile, basic o BCa
    n_resamples: 10000
    n_resamples_auc: 1000         # bootstrap estratificado de la diferencia de AUC macro (por corrida)
    seed: 2026
  # IC sobre el conjunto de prueba remuestreando lesion_id (sección 3 del benchmark): en cada
  # remuestreo se recalcula la exactitud balanceada de cada corrida y se promedia entre corridas.
  lesion_bootstrap:
    n_resamples: 10000
    seed: 2026
  mcnemar_exact_below: 25        # binomial exacta si b + c < 25; si no, chi-cuadrado con corrección de continuidad
  wilcoxon_zero_method: wilcox    # diferencias nulas: wilcox (se descartan) o pratt
  nadeau_bengio_splits: [val, test]
  # Cotas de referencia de la literatura (sección 5.4 del benchmark); source = clave de references.bib.
  # La diferencia con el mejor modelo solo se calcula para las cotas cuya métrica es primary_metric_label.
  primary_metric_label: exactitud balanceada
  reference_bounds:
    - name: "Lectores con más de diez años de experiencia"
      value: 0.627                # 18,8 de 30
      metric: exactitud en lotes de 30 imágenes
      note: "otra muestra de prueba y otra métrica; solo referencia contextual"
      source: tschandl2019
    - name: "Tres mejores algoritmos del reto ISIC 2018 (mismo estudio)"
      value: 0.847                # 25,4 de 30
      metric: exactitud en lotes de 30 imágenes
      note: "otra muestra de prueba y otra métrica; solo referencia contextual"
      source: tschandl2019
    - name: "Partición agrupada por lesión"
      value: 0.70                 # aproximado
      metric: exactitud balanceada
      note: "otra muestra de prueba; valor aproximado"
      source: pinar2026
