# Configuración común a todos los modelos y al EDA.
# Pendiente de añadir para el entrenamiento: resolución de entrada, métricas, épocas,
# early stopping.

seed: 42

# Rutas relativas a la raíz del proyecto (src/data.py las resuelve como absolutas).
paths:
  raw_dir: data/raw
  images_dir: data/raw/images
  metadata_csv: data/raw/HAM10000_metadata.csv
  segmentations_dir: data/raw/segmentations
  hashes_json: data/hashes.json
  phash_csv: data/interim/phash.csv
  duplicates_candidates_csv: data/duplicados_candidatos.csv
  duplicates_confirmed_csv: data/duplicados_confirmados.csv
  splits_csv: data/splits.csv
  splits_hash_json: data/splits_hash.json
  eda_cache_dir: data/processed/eda_cache
  artifacts_annotation_csv: data/anotacion_artefactos.csv
  train_color_stats_json: data/train_color_stats.json
  outliers_csv: data/atipicos_imagenes.csv
  embeddings_cache: data/processed/embeddings_mobilenetv2.npz

# Formato de los archivos
image_ext: .jpg
mask_suffix: _segmentation.png
source_column: dataset          # columna opcional con la fuente de cada imagen
missing_tokens: ["unknown", ""] # valores que se cuentan como faltantes
missing_indicator_columns: [age, sex, localization]  # columnas con indicador de faltante

# Calidad de los metadatos
age_min_valid: 1
age_max_valid: 100
valid_categories:              # categorías documentadas de HAM10000
  sex: [male, female, unknown]
  localization: [abdomen, acral, back, chest, ear, face, foot, genital, hand, lower extremity,
                 neck, scalp, trunk, unknown, upper extremity]
  dx: [akiec, bcc, bkl, df, mel, nv, vasc]
  dx_type: [histo, follow_up, consensus, confocal]
  dataset: [rosendahl, vidir_modern, vidir_molemax, vienna_dias]
lesion_consistency_columns: [age, sex, localization, dx_type, dataset]
eda_inconsistency_examples: 20  # filas de ejemplo de lesiones inconsistentes

# Partición
test_size: 0.15
n_folds: 5
overwrite_splits: false

# Duplicados (pHash)
phash_hash_size: 8              # hash de 8 x 8 = 64 bits
phash_threshold: 2              # distancia de Hamming máxima para proponer un par
phash_dist_max: 16              # distancia máxima que muestra la tabla de distribución
eda_pairs_page_size: 20         # pares por página en la revisión visual
eda_pairs_pages_per_figure: 2   # páginas que se muestran una al lado de la otra

# Caché e inspección visual
eda_cache_max_side: 300
eda_cache_format: jpg
eda_cache_jpeg_quality: 95
eda_grid_per_class: 16
eda_grid_ncols: 8

# Artefactos
eda_annotation_per_class: 40
eda_annotation_page_size: 20
artifact_columns: [regla, tinta, vello, burbujas, vineteado, parche_color]
eda_vignette_corner_frac: 0.1   # lado de cada esquina, fracción del lado menor

# Color
eda_luma_weights: [0.299, 0.587, 0.114]  # luminancia ITU-R BT.601
shades_of_gray_p: 6
eda_sog_examples_per_class: 1

# Máscaras de lesión
mask_threshold: 127
mask_min_frac: 0.001            # fracción de área por debajo de la cual la máscara está casi vacía
mask_max_frac: 0.95             # fracción de área por encima de la cual la máscara está casi completa
eda_mask_overlay_n: 16          # imágenes por cuadrícula de contornos de máscara

# Mapas medios, imágenes media y capacidad predictiva del fondo
eda_mean_image_size: [64, 48]   # (ancho, alto)
min_background_frac: 0.05       # fracción mínima de fondo para incluir una imagen
bg_probe_max_iter: 2000         # iteraciones de la regresión logística multinomial

# Validación adversarial
adv_hist_bins: 16
adv_cv_folds: 5
adv_max_iter: 1000

# Calidad de imagen
clip_low: 0                     # valor de píxel recortado por abajo (<=)
clip_high: 255                  # valor de píxel recortado por arriba (>=)
clip_frac_alert: 0.01           # proporción de píxeles recortados que activa la alerta

# Atípicos en las características de imagen
iqr_factor: 1.5
robust_z: 3.5
mahal_quantile: 0.975
eda_outlier_grid_n: 16

# Estadística
chi2_mc_iterations: 10000       # permutaciones para el p-valor simulado de chi-cuadrado
eda_hist_bins: auto             # intervalos de los histogramas univariados (numpy)
eda_spearman_top_pairs: 15      # pares con mayor |rho| que se muestran

# Embeddings
eda_embeddings: true
eda_embeddings_input_size: 224
eda_embeddings_batch_size: 64
eda_tsne_perplexity: 30
emb_probe_max_iter: 2000        # iteraciones de la regresión logística sobre los embeddings
