# Configuración propia de DenseNet-201 (src/models/densenet201.py).
name: densenet201
keras_application: DenseNet201    # keras.applications.DenseNet201
weights: imagenet
input_size: 224                   # debe coincidir con train.image_size de base.yaml
gradcam_layer: relu               # capa del backbone anidado para Grad-CAM (src/gradcam.py)
saliency: gradcam                 # gradcam (CNN) o rollout (ViT); src/interpret.py
expected_params: 18335431         # total con la cabeza de 7 clases; lo verifica src.verify_models

# Se llenan con outputs/tuning/densenet201/best.json tras `python -m src.tune --model densenet201`.
hyperparameters:
  learning_rate: null             # tasa inicial de la fase B (decaimiento coseno)
  weight_decay: null              # AdamW, fases A y B
  dropout: null                   # antes de la capa densa final
