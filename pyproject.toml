[project]
name = "skin-lesion-dl"
version = "0.1.0"
description = "Clasificación de imágenes dermatoscópicas de HAM10000 con TensorFlow/Keras"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "imagehash>=4.3.2",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.6",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "tensorflow[and-cuda]>=2.20,<2.21",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]
