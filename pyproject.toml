[project]
name = "skin-lesion-dl"
version = "0.1.0"
description = "Clasificación de imágenes dermatoscópicas de HAM10000 con TensorFlow/Keras"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "imagehash>=4.3.2",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.6",
    "keras-hub>=0.33.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.18.0",
    "numpy>=2.4.6",
    "onnx>=1.23.2",
    "onnxruntime>=1.32.0",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "tensorflow[and-cuda]>=2.20,<2.21",
    "tf2onnx>=1.17.0",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dashboard = [
    "dash>=4.5.1",
    "dash-bootstrap-components>=2.0.4",
    "gunicorn>=26.2.0",
    "plotly>=7.2.0",
]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:dash"
filterwarnings = ["ignore::DeprecationWarning:keras.*"]
